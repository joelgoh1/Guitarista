ad props good job. &quot;,&quot;author_userid&quot;:0,&quot;rating&quot;:38,&quot;userid&quot;:22257,&quot;usergroupid&quot;:2,&quot;username&quot;:&quot;Xdeniedx18&quot;,&quot;date_created&quot;:1019520000,&quot;type&quot;:4,&quot;parent_id&quot;:0,&quot;added_from&quot;:&quot;&quot;,&quot;updated_at&quot;:null,&quot;status&quot;:&quot;new&quot;,&quot;moderator_user_id&quot;:11953509,&quot;likes_count&quot;:60,&quot;dislikes_count&quot;:22,&quot;contributor_level&quot;:null,&quot;avatar&quot;:&quot;https://tabs.ultimate-guitar.com/static/users/7/5/2/22257.gif?d=d&quot;,&quot;date&quot;:1019520000,&quot;user_iq&quot;:10,&quot;localized_text&quot;:&quot;&quot;},{&quot;id&quot;:530699,&quot;rowid&quot;:6125,&quot;text&quot;:&quot;Nice, thx for tabbing the chords out - its a great help for us newbies!&quot;,&quot;author_userid&quot;:0,&quot;rating&quot;:21,&quot;userid&quot;:0,&quot;usergroupid&quot;:0,&quot;username&quot;:&quot;pubes666&quot;,&quot;date_created&quot;:1012867200,&quot;type&quot;:4,&quot;parent_id&quot;:0,&quot;added_from&quot;:&quot;&quot;,&quot;updated_at&quot;:null,&quot;status&quot;:&quot;new&quot;,&quot;moderator_user_id&quot;:11953509,&quot;likes_count&quot;:30,&quot;dislikes_count&quot;:9,&quot;contributor_level&quot;:3,&quot;avatar&quot;:&quot;https://tabs.ultimate-guitar.com/static/users/0/0/0/0.gif?d=d&quot;,&quot;date&quot;:1012867200,&quot;user_iq&quot;:0,&quot;localized_text&quot;:&quot;&quot;},{&quot;id&quot;:1579912,&quot;rowid&quot;:6125,&quot;text&quot;:&quot;Hey, here is a neat little fact:\r\n\r\nYou can put the capo where ever you like.  You see, a capo is a just a tool, which can either be used be lazy people who simply cannot transpose (or noobs, who don&#039;t have enough theory to do so), or by people who write a progression that sounds good in a set key, then realize they can&#039;t sing the melody well: Changing the key will invariably change the way the chords sound relative to each other (we&#039;re playing guitars, not pianos), but by using a capo, they will still sound correct, just higher in key.  So just because Liam felt more comfortable singing the song in A, does not mean you have to.  Capo at 7, play it in D# if you like, your guitar will sound like a mandolin, but at least you&#039;ll be singing in a key you are comfortable with.\r\n\r\nAnd another correction (aside from all the people who still don&#039;t understand the chord names are correct relative to the capo),\r\nA few people said things like \&quot;It would just be easier if you tabbed it in E....\&quot;  You mean in G.  Just because the first chord in the verse is an Em7, doesn&#039;t mean it&#039;s in E.  In fact, an Em7 sounds quite ugly to North American ears when played in a song that is in the key of Emaj.\r\n\r\nBut I suppose this is all a lost cause, people dumb enough not to realize this probably would never read a post longer then \&quot;Hey bro, f*cking great tab, chords all all wrong, and the lyrics are in spanish, but it&#039;s AWESOME!! 5 Stars!!\&quot;&quot;,&quot;author_userid&quot;:0,&quot;rating&quot;:14,&quot;userid&quot;:475184,&quot;usergroupid&quot;:21,&quot;username&quot;:&quot;bendale&quot;,&quot;date_created&quot;:1168946004,&quot;type&quot;:4,&quot;parent_id&quot;:0,&quot;added_from&quot;:&quot;&quot;,&quot;updated_at&quot;:null,&quot;status&quot;:&quot;new&quot;,&quot;moderator_user_id&quot;:11953509,&quot;likes_count&quot;:30,&quot;dislikes_count&quot;:16,&quot;contributor_level&quot;:1,&quot;avatar&quot;:&quot;https://tabs.ultimate-guitar.com/static/users/4/8/1/475184.gif?d=d&quot;,&quot;date&quot;:1168946004,&quot;user_iq&quot;:32,&quot;localized_text&quot;:&quot;&quot;}],&quot;comments&quot;:244,&quot;stats&quot;:{&quot;view_total&quot;:13449758,&quot;favorites_count&quot;:51222},&quot;chord_type&quot;:&quot;guitar&quot;,&quot;tab_corrects&quot;:[],&quot;is_simplify_available&quot;:true,&quot;isSimplified&quot;:null,&quot;simplifiedUrl&quot;:null,&quot;can_edit_tab&quot;:false,&quot;can_ed     {
        "@type": "Comment",
        "comment": "Hey, here is a neat little fact:\r\n\r\nYou can put the capo where ever you like.  You see, a capo is a just a tool, which can either be used be lazy people who simply cannot transpose (or noobs, who don&#039;t have enough theory to do so), or by people who write a progression that sounds good in a set key, then realize they can&#039;t sing the melody well: Changing the key will invariably change the way the chords sound relative to each other (we&#039;re playing guitars, not pianos), but by using a capo, they will still sound correct, just higher in key.  So just because Liam felt more comfortable singing the song in A, does not mean you have to.  Capo at 7, play it in D# if you like, your guitar will sound like a mandolin, but at least you&#039;ll be singing in a key you are comfortable with.\r\n\r\nAnd another correction (aside from all the people who still don&#039;t understand the chord names are correct relative to the capo),\r\nA few people said things like &quot;It would just be easier if you tabbed it in E....&quot;  You mean in G.  Just because the first chord in the verse is an Em7, doesn&#039;t mean it&#039;s in E.  In fact, an Em7 sounds quite ugly to North American ears when played in a song that is in the key of Emaj.\r\n\r\nBut I suppose this is all a lost cause, people dumb enough not to realize this probably would never read a post longer then &quot;Hey bro, f*cking great tab, chords all all wrong, and the lyrics are in spanish, but it&#039;s AWESOME!! 5 Stars!!&quot;",
